<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img" aria-labelledby="ztlTitle ztlDesc" font-family="Georgia, 'Times New Roman', serif">
<title id="ztlTitle">Siena's ZTL and the car parks around it</title>
<desc id="ztlDesc">Schematic diagram. Siena's historic centre is a restricted traffic zone enforced by cameras 24 hours a day; entering without a permit generates an automatic fine that reaches rental drivers months later. Six managed car parks sit around the walls: Stadio-Fortezza at 26 euros a day and part-closed on Wednesdays, La Stazione with an escalator, Santa Caterina and San Francesco at 35 euros with escalators, Il Duomo and Il Campo at 35 euros. Guests staying overnight can ask their accommodation for a 25 euro rate instead of 35. Il Campino is free and the Policlinico car parks cost 2.50 euros a day. Rates checked July 2026.</desc>

<rect width="680" height="600" fill="#F5EDE3"/>

