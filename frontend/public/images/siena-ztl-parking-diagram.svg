<text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#A0492A">ZTL — cameras 24/7</text>
<text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#A0492A">Piazza del Campo</text>
<line x1="272" y1="300" x2="408" y2="300" stroke="#C65A3A" stroke-width="0.5" opacity="0.4"/>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#8C3A1E">Enter without a permit:</text>
<text x="340" y="336" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#8C3A1E">automatic fine, months later</text>
</g>

