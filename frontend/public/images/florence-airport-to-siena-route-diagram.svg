<title id="routeTitle">Two-stage route from Florence Airport to Siena</title>
<desc id="routeDesc">Schematic diagram. There is no direct bus or train from Florence Airport to Siena; the journey is two stages. Stage one is the T2 tram from Florence Airport to the Santa Maria Novella area, 1.70 euros, about 20 minutes, alighting at Alamanni. Stage two is the 131R bus from Firenze Autostazione to Siena, 8.40 euros bought at a counter or 13.00 euros from the driver, about 75 to 80 minutes, arriving at Antiporto Camollia. The cheapest total is 10.10 euros. Validate every ticket the moment you board or risk a fine. Fares checked July 2026.</desc>

