name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        # CI=true on purpose, matching Cloudflare Pages exactly: CRA treats
        # lint warnings as errors there too. This workflow once set CI=false
        # "because the e2e suite is the gate" — and that masking let a single
        # eslint warning break every production deploy for three days
        # (13-17 Aug 2026, issue #108) while GitHub stayed green. A build
        # that cannot deploy must fail here first.
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
