name: Daily Publish Trigger

# The article drip is date-gated in two layers: the SPA filters the article
# index at runtime (an article appears in listings the minute its WIB date
# arrives), but the prerendered static HTML, the sitemap and the per-route
# titles are baked at build time. Without a daily rebuild, a day with no
# merge is a day where crawlers and no-JS readers never see the new article,
# and — if the runtime-filter bundle has not shipped yet — neither does
# anyone else. This workflow guarantees one production rebuild per day,
# just after WIB midnight, whether or not a human merged anything.
#
# History: this file began as a one-shot trigger for the Siena cluster
# launch (12 July 2026, cron "5 5 12 7 *" with a date guard). The drip then
# ran for a month on the side effect of daily merges; when merges paused on
# 17–18 August, publishing silently stopped with them. Generalised to a
# daily cron on 18 August 2026.

on:
  workflow_dispatch:
  schedule:
    # 00:05 WIB (UTC+7) daily. GitHub cron uses UTC.
    - cron: "5 17 * * *"

# issues: write is not used by this workflow's own steps — it exists because
# the called deploy-smoke.yml requests it (for its failure-tracking issue),
# and a reusable workflow may not request more than its caller holds. Without
# it every run dies at startup before any job begins, which is exactly how
# runs #2-#6 failed (startup_failure, 17-20 Aug 2026) while the drip
# silently rode on daily merges again.
permissions:
  contents: write
  issues: write

concurrency:
  group: scheduled-siena-cluster-publish
  cancel-in-progress: false

jobs:
  trigger-redeploy:
    name: Trigger production redeploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create redeploy trigger commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: daily publish rebuild ($(date -u +%Y-%m-%d) drip)"
          git push

      - name: Trigger Cloudflare Pages deploy hook if configured
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "No Cloudflare deploy hook secret configured; relying on the GitHub push integration."
            exit 0
          fi

          curl -fsS -X POST "$DEPLOY_HOOK_URL"

  # A push made with GITHUB_TOKEN does not fire on:push workflows (GitHub's
  # recursion guard), so the smoke check must be invoked explicitly here.
  # Cloudflare's GitHub integration is a webhook, not a workflow, and still
  # sees the push.
  smoke:
    name: Confirm live production output
    needs: trigger-redeploy
    uses: ./.github/workflows/deploy-smoke.yml
